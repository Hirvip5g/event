name: Actualizar Agenda Automática

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub[cite: 2]
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta automáticamente cada 6 horas[cite: 2]

permissions:
  contents: write

jobs:
  update-agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests pyrebase4

      - name: Procesar Agenda
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: python procesar_eventos_manual.py  # O procesar_eventos_manual_2.py según corresponda[cite: 2]

      - name: Guardar cambios en GitHub (Opcional)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "Agenda actualizada localmente" || exit 0
          git pull --rebase origin main
          git push origin main